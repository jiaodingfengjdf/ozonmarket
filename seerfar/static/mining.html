<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关键词挖掘 · Ozon 数据选品台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="mining">

<header class="topbar">
  <div class="brand">
    <div class="brandmark">S</div>
    <div class="brandtext">
      <div class="brandname">Ozon 数据选品台</div>
      <div class="brandsub">Seerfar Open API · 数据口径近 30 天</div>
    </div>
  </div>
  <div class="stats" id="statsBar"><span class="skeleton-text">读取状态…</span></div>
  <div class="topactions">
    <button class="iconbtn" id="btnRefresh" title="刷新状态">刷新</button>
  </div>
</header>
<nav class="pagenav">
  <div class="pagenav-inner">
    <a class="pnav" href="/">在线选品</a>
    <a class="pnav" href="/hotwords">市场热词</a>
    <a class="pnav active" href="/mining">关键词挖掘</a>
    <a class="pnav" href="/backsearch">关键词反查</a>
    <a class="pnav" href="/product">竞品详情</a>
    <a class="pnav" href="/category">类目大盘</a>
    <a class="pnav" href="/shop">店铺分析</a>
    <a class="pnav" href="/local-products">本地商品库</a>
    <a class="pnav" href="/local-keywords">本地关键词库</a>
    <a class="pnav" href="/logs">调用日志</a>
  </div>
</nav>
<div class="layout no-sidebar">
  <main class="main">

<section class="panel active" data-panel="mining">
      <div class="pagehead">
        <div><h1>关键词挖掘</h1><p class="muted">从一个种子词扩展长尾词，看相关度与竞争情况</p></div>
      </div>
      <form class="filtercard" data-tool="mining" autocomplete="off">
        <div class="fall">
          <div class="field span2"><label class="flab">种子词</label><div class="fctl">
            <input class="ingrow" data-f="keyword" placeholder="必填，如 наушники / 无线耳机" required>
            <select class="insm" data-f="match_type"><option value="0">精准匹配</option><option value="1">模糊匹配</option></select>
          </div></div>
          <div class="field"><label class="flab">包含词</label><div class="fctl"><input class="infull" data-f="include_keywords" placeholder="必须包含的词，逗号分隔"></div></div>
          <div class="field"><label class="flab">排除词</label><div class="fctl"><input class="infull" data-f="exclude_keywords" placeholder="要排除的词，逗号分隔"></div></div>
          <div class="field"><label class="flab">相关度</label><div class="fctl range">
            <input class="innum" type="number" data-f="relevancy_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="relevancy_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">月搜索量</label><div class="fctl range">
            <input class="innum" type="number" data-f="searchVolume_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="searchVolume_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">竞品数</label><div class="fctl range">
            <input class="innum" type="number" data-f="products_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="products_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">标题密度</label><div class="fctl range">
            <input class="innum" type="number" data-f="titleDensity_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="titleDensity_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">均价 (₽)</label><div class="fctl range">
            <input class="innum" type="number" data-f="price_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="price_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">市场空间</label><div class="fctl range">
            <input class="innum" type="number" data-f="marketSpace_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="marketSpace_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">唯一搜索量</label><div class="fctl range">
            <input class="innum" type="number" data-f="uniqQueriesWCa_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="uniqQueriesWCa_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">CA 指数</label><div class="fctl range">
            <input class="innum" type="number" data-f="ca_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="ca_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">词数</label><div class="fctl range">
            <input class="innum" type="number" data-f="wordCount_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="wordCount_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">卖家数</label><div class="fctl range">
            <input class="innum" type="number" data-f="sellers_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="sellers_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">广告对手数</label><div class="fctl range">
            <input class="innum" type="number" data-f="adRivalCount_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="adRivalCount_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">浏览量</label><div class="fctl range">
            <input class="innum" type="number" data-f="productViews_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="productViews_max" placeholder="最高"></div></div>
          <div class="field"><label class="flab">转化份额</label><div class="fctl range">
            <input class="innum" type="number" data-f="conversionSharing_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="conversionSharing_max" placeholder="最高"><span class="unit">%</span></div></div>
          <div class="field"><label class="flab">30 天增长</label><div class="fctl range">
            <input class="innum" type="number" data-f="searchChange30_min" placeholder="最低"><span class="dash">—</span><input class="innum" type="number" data-f="searchChange30_max" placeholder="最高"><span class="unit">%</span></div></div>
        </div>
        <div class="applied-bar"><span class="applied-lab">已选条件</span><div class="applied-tags" data-tags><span class="muted">无</span></div></div>
        <div class="formfoot">
          <div class="foot-left">
            <label class="chk"><input type="checkbox" data-f="force"> 强制刷新</label>
            <label class="chk">每页 <input class="inxs" type="number" data-f="size" value="30" min="1" max="100"></label>
            <select class="insm" data-f="sort"><option value="relevancy">按 相关度</option><option value="searchVolume">按 搜索量</option>
              <option value="count30GrowthRate">按 30天增长</option><option value="competingProducts">按 竞品数</option></select>
            <select class="inxs" data-f="direction"><option value="DESC">降序</option><option value="ASC">升序</option></select>
          </div>
          <div class="foot-right"><button type="button" class="btn ghost" data-reset>重置</button>
            <button type="submit" class="btn primary"><span class="btnlabel">挖掘</span></button></div>
        </div>
      </form>
      <section class="resultcard">
        <div class="resulthead">
          <div class="resultr"><h3>长尾词</h3><span class="badge solid" data-count>0</span><span class="muted" data-note></span></div>
          <div class="resultbar-actions"><button class="btn ghost sm" data-export>导出 XLSX</button></div>
        </div>
        <div class="statusline" data-meta>输入种子词后点「挖掘」。</div>
        <div class="tablewrap" data-table><div class="placeholder"><div class="ph-icon">◈</div><div class="ph-title">还没有查询结果</div>
          <div class="ph-desc">先填一个种子词（俄文或中文），再点「挖掘」</div></div></div>
        <div class="pager" data-pager></div>
      </section>
    </section>

  </main>
</div>

<div id="drawer" class="drawer hidden">
  <div class="drawer-head"><span id="drawerTitle">商品详情</span><button id="drawerClose">×</button></div>
  <div id="drawerBody" class="drawer-body"></div>
</div>
<div id="toast" class="toast hidden"></div>
</body>
<script src="/static/app.js"></script>
</html>
