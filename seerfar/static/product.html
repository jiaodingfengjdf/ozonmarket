<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竞品详情 · Ozon 数据选品台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="product">

<header class="topbar">
  <div class="brand">
    <div class="brandmark">S</div>
    <div class="brandtext">
      <div class="brandname">Ozon 数据选品台</div>
      <div class="brandsub">Seerfar Open API · 数据口径近 30 天</div>
    </div>
  </div>
  <div class="stats" id="statsBar"><span class="skeleton-text">读取状态…</span></div>
  <div class="topactions">
    <button class="iconbtn" id="btnRefresh" title="刷新状态">刷新</button>
  </div>
</header>
<nav class="pagenav">
  <div class="pagenav-inner">
    <a class="pnav" href="/">在线选品</a>
    <a class="pnav" href="/hotwords">市场热词</a>
    <a class="pnav" href="/mining">关键词挖掘</a>
    <a class="pnav" href="/backsearch">关键词反查</a>
    <a class="pnav active" href="/product">竞品详情</a>
    <a class="pnav" href="/category">类目大盘</a>
    <a class="pnav" href="/shop">店铺分析</a>
    <a class="pnav" href="/local-products">本地商品库</a>
    <a class="pnav" href="/local-keywords">本地关键词库</a>
    <a class="pnav" href="/logs">调用日志</a>
  </div>
</nav>
<div class="layout no-sidebar">
  <main class="main">

<section class="panel active" data-panel="product">
      <div class="pagehead">
        <div><h1>竞品详情</h1><p class="muted">单个商品的销量、价格、库存、类目排名与趋势</p></div>
      </div>
      <form class="filtercard" data-tool="product" autocomplete="off">
        <div class="fall">
          <div class="field"><label class="flab">商品 SKU</label><div class="fctl">
            <input class="ingrow" data-f="sku" placeholder="必填，如 175924376" required></div></div>
          <div class="field"><label class="flab">统计区间</label><div class="fctl">
            <select class="insm" data-f="date_range"><option value="past_30_days">近 30 天</option><option value="past_7_days">近 7 天</option>
              <option value="past_60_days">近 60 天</option><option value="past_90_days">近 90 天</option>
              <option value="past_180_days">近 180 天</option><option value="past_365_days">近一年</option></select></div></div>
          <div class="field"><label class="flab">附加</label><div class="fctl radios">
            <label><input type="checkbox" data-f="similar"><span>同时查相似商品</span></label></div></div>
        </div>
        <div class="formfoot">
          <div class="foot-left"><span class="tiny">查一次约 20 积分（竞品 + 月度趋势）</span></div>
          <div class="foot-right"><button type="submit" class="btn primary"><span class="btnlabel">查竞品</span></button></div>
        </div>
      </form>
      <section class="resultcard">
        <div class="statusline" data-meta>输入 SKU 后点「查竞品」，会显示逐日销量/价格趋势、月度销量、类目排名。</div>
        <div class="tablewrap" data-table id="productView"><div class="placeholder"><div class="ph-icon">◈</div>
          <div class="ph-title">还没有查询结果</div><div class="ph-desc">填一个商品 SKU 查看详情</div></div></div>
      </section>
    </section>

  </main>
</div>

<div id="drawer" class="drawer hidden">
  <div class="drawer-head"><span id="drawerTitle">商品详情</span><button id="drawerClose">×</button></div>
  <div id="drawerBody" class="drawer-body"></div>
</div>
<div id="toast" class="toast hidden"></div>
</body>
<script src="/static/app.js"></script>
</html>
